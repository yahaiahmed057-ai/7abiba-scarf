<h2>لفتح المتجر لازم تشغيل السيرفر أولًا</h2>
<p><b>ويندوز:</b> دبل كليك على <code>start.bat</code><br><b>ماك / لينكس:</b> شغّلي <code>start.command</code> أو <code>start.sh</code></p>
<p>بعدها يفتح الموقع تلقائيًا، أو ادخلي على:<br><a href="http://localhost:3000">http://localhost:3000</a> — الإدارة: <a href="http://localhost:3000/admin/">/admin/</a></p>
<p><small>يحتاج Node.js 22 أو أحدث (nodejs.org).</small></p></body></html>
